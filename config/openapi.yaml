  "paths": {
    "/api/v2/public/verifications/requests/id_document": {
      "post": {
        "summary": "Document Verification",
        "description": "Verify government-issued identity documents such as passports, national IDs, and driver's licenses across 47+ African countries.\n\nPublic API creates always use direct (offsite) mode. Submit the document image in `input_data.document.proof`.",
        "operationId": "single-id_document",
        "tags": [
          "single-identity-verification"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "verification_type",
                  "input_data"
                ],
                "properties": {
                  "verification_type": {
                    "type": "string",
                    "description": "The verification type identifier.",
                    "enum": [
                      "id_document"
                    ]
                  },
                  "input_data": {
                    "type": "object",
                    "required": [
                      "email",
                      "language",
                      "document"
                    ],
                    "properties": {
                      "email": {
                        "type": "string",
                        "format": "email",
                        "description": "Customer's email address."
                      },
                      "language": {
                        "type": "string",
                        "description": "Language code (e.g. \"EN\", \"FR\").",
                        "example": "EN"
                      },
                      "country": {
                        "type": "string",
                        "description": "ISO 3166-1 alpha-2 country code (e.g. \"NG\", \"ZA\", \"GH\", \"KE\").",
                        "example": "NG"
                      },
                      "first_name": {
                        "type": "string",
                        "description": "Customer's first name for cross-validation."
                      },
                      "last_name": {
                        "type": "string",
                        "description": "Customer's last name for cross-validation."
                      },
                      "document": {
                        "type": "object",
                        "required": [
                          "proof"
                        ],
                        "description": "Document proof and matching options.",
                        "properties": {
                          "proof": {
                            "type": "string",
                            "description": "Front image of the identity document. Base64 data URI or HTTPS URL to jpeg/jpg/png/pdf.",
                            "example": "data:image/jpeg;base64,/9j/4AAQ..."
                          },
                          "backside_proof": {
                            "type": "string",
                            "description": "Back image of the document, same format as proof."
                          },
                          "backside_proof_required": {
                            "type": "boolean",
                            "description": "true to require a back image, false to skip it. Defaults to false.",
                            "default": false
                          },
                          "allow_offline": {
                            "type": "boolean",
                            "description": "Defaults to true.",
                            "default": true
                          },
                          "verification_mode": {
                            "type": "string",
                            "description": "Capture mode hint. Common value: \"any\".",
                            "example": "any"
                          },
                          "fetch_enhanced_data": {
                            "type": "boolean",
                            "description": "true to return enhanced OCR/extracted fields, false to skip. Defaults to true.",
                            "default": true
                          },
                          "name": {
                            "type": "object",
                            "description": "Optional name matching details for the document owner.",
                            "properties": {
                              "first_name": {
                                "type": "string",
                                "description": "Expected first name on the document."
                              },
                              "last_name": {
                                "type": "string",
                                "description": "Expected last name on the document."
                              },
                              "fuzzy_match": {
                                "type": "boolean",
                                "description": "true to allow fuzzy name matching, false for exact match. Defaults to true.",
                                "default": true
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              },
              "examples": {
                "default": {
                  "summary": "Sample request",
                  "value": {
                    "verification_type": "id_document",
                    "input_data": {
                      "email": "customer@example.com",
                      "language": "EN",
                      "country": "NG",
                      "first_name": "John",
                      "last_name": "Doe",
                      "document": {
                        "proof": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD...",
                        "backside_proof_required": false,
                        "allow_offline": true,
                        "verification_mode": "any",
                        "fetch_enhanced_data": true,
                        "name": {
                          "first_name": "John",
                          "last_name": "Doe",
                          "fuzzy_match": true
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "400": {
            "description": "Bad Request - Missing or invalid parameters"
          },
          "401": {
            "description": "Unauthorized - Invalid or missing API key"
          },
          "403": {
            "description": "Forbidden - Insufficient credits or inactive key"
          },
          "404": {
            "description": "Not Found - Identity record not found"
          },
          "500": {
            "description": "Internal Server Error"
          },
          "201": {
            "description": "Verification created successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/V2SuccessResponse"
                },
                "examples": {
                  "success": {
                    "summary": "Successful verification",
                    "value": {
                      "success": true,
                      "message": "Verification request created successfully.",
                      "data": {
                        "id": "ver_9gjzgc36t",
                        "verification_type": "id_document",
                        "status": "verified",
                        "created_at": "2026-02-09T08:01:42.891Z",
                        "response_data": {
                          "first_name": "John",
                          "last_name": "Doe",
                          "date_of_birth": "1990-01-15",
                          "gender": "Male"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "x-zuplo-route": {
          "corsPolicy": "none",
          "handler": {
            "export": "urlForwardHandler",
            "module": "$import(@zuplo/runtime)",
            "options": {
              "baseUrl": "https://api.verifyafrica.io/api/v2/public/verifications/requests/"
            }
          }
        }
      }
    },
    "/api/v2/public/verifications/requests/face_match": {
      "post": {
        "summary": "Facial Screening",
        "description": "Perform real-time liveness detection and face match verification against a reference document.\n\nPublic API creates always use direct (offsite) mode. Submit the face image in `input_data.face.proof` with `input_data.face.verification_mode`.",
        "operationId": "single-face_match",
        "tags": [
          "single-identity-verification"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "verification_type",
                  "input_data"
                ],
                "properties": {
                  "verification_type": {
                    "type": "string",
                    "description": "The verification type identifier.",
                    "enum": [
                      "face_match"
                    ]
                  },
                  "input_data": {
                    "type": "object",
                    "required": [
                      "face"
                    ],
                    "properties": {
                      "email": {
                        "type": "string",
                        "format": "email",
                        "description": "Customer's email address."
                      },
                      "language": {
                        "type": "string",
                        "description": "Language code (e.g. \"EN\", \"FR\"). Defaults to \"EN\".",
                        "example": "EN"
                      },
                      "country": {
                        "type": "string",
                        "description": "ISO 3166-1 alpha-2 country code (e.g. \"NG\", \"ZA\", \"GH\", \"KE\")."
                      },
                      "face": {
                        "type": "object",
                        "required": [
                          "proof",
                          "verification_mode"
                        ],
                        "description": "Face image and verification options.",
                        "properties": {
                          "proof": {
                            "type": "string",
                            "description": "Face image. Base64 data URI or HTTPS URL to jpeg/jpg/png.",
                            "example": "data:image/jpeg;base64,/9j/4AAQ..."
                          },
                          "verification_mode": {
                            "type": "string",
                            "enum": [
                              "any",
                              "image_only",
                              "video_only"
                            ],
                            "description": "Capture type for the submitted face media.",
                            "example": "any"
                          },
                          "allow_offline": {
                            "type": "boolean",
                            "description": "Defaults to false.",
                            "default": false
                          },
                          "check_duplicate_request": {
                            "type": "boolean",
                            "description": "true to flag duplicate faces, false to allow. Defaults to false.",
                            "default": false
                          }
                        }
                      }
                    }
                  }
                }
              },
              "examples": {
                "default": {
                  "summary": "Sample request",
                  "value": {
                    "verification_type": "face_match",
                    "input_data": {
                      "email": "customer@example.com",
                      "language": "EN",
                      "face": {
                        "proof": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD...",
                        "verification_mode": "any",
                        "allow_offline": false,
                        "check_duplicate_request": false
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "400": {
            "description": "Bad Request - Missing or invalid parameters"
          },
          "401": {
            "description": "Unauthorized - Invalid or missing API key"
          },
          "403": {
            "description": "Forbidden - Insufficient credits or inactive key"
          },
          "404": {
            "description": "Not Found - Identity record not found"
          },
          "500": {
            "description": "Internal Server Error"
          },
          "201": {
            "description": "Verification created successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/V2SuccessResponse"
                },
                "examples": {
                  "success": {
                    "summary": "Successful verification",
                    "value": {
                      "success": true,
                      "message": "Verification request created successfully.",
                      "data": {
                        "id": "ver_9gjzgc36t",
                        "verification_type": "face_match",
                        "status": "verified",
                        "created_at": "2026-02-09T08:01:42.891Z",
                        "response_data": {
                          "first_name": "John",
                          "last_name": "Doe",
                          "date_of_birth": "1990-01-15",
                          "gender": "Male"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "x-zuplo-route": {
          "corsPolicy": "none",
          "handler": {
            "export": "urlForwardHandler",
            "module": "$import(@zuplo/runtime)",
            "options": {
              "baseUrl": "https://api.verifyafrica.io/api/v2/public/verifications/requests/"
            }
          }
