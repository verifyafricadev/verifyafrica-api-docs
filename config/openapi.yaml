                "schema": {
                  "$ref": "#/components/schemas/Error Response"
                },
                "examples": {
                  "error": {
                    "summary": "Unexpected error",
                    "value": {
                      "success": false,
                      "message": "An unexpected error occurred.",
                      "errors": [
                        "An unexpected error occurred."
                      ]
                    }
                  }
                }
              }
            }
          },
          "201": {
            "description": "Verification created successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Success Response"
                },
                "examples": {
                  "success": {
                    "summary": "Successful verification",
                    "value": {
                      "success": true,
                      "message": "Verification request accepted. Processing has started; listen for the verification.completed webhook or poll GET /api/v2/public/verifications/requests/?verification_id=\u2026",
                      "data": {
                        "id": "ver_9gjzgc36t",
                        "verification_type": "id_document",
