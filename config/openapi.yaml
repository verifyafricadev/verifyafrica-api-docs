    "/api/v2/public/verifications/requests/kyb_screening": {
      "post": {
        "summary": "KYB - Know Your Business",
        "description": "Perform full Know Your Business checks including ownership structure, beneficial owners, and registry data.\n\nPublic API creates always use direct (offsite) mode.",
        "operationId": "single-kyb_screening",
        "tags": [
          "single-compliance-screening"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
