    "/api/v2/public/verifications/requests/aml_screening": {
      "post": {
        "summary": "AML Screening",
        "description": "Screen individuals against global sanctions lists, PEP databases, and adverse media sources.\n\nPublic API creates always use direct (offsite) mode. Configure screening categories with `background_checks.filters` and precision with `background_checks.match_score` (0\u2013100).",
        "operationId": "single-aml_screening",
        "tags": [
          "single-compliance-screening"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "verification_type",
                  "input_data"
                ],
                "properties": {
                  "verification_type": {
                    "type": "string",
                    "description": "The verification type identifier.",
                    "enum": [
                      "aml_screening"
                    ]
                  },
                  "input_data": {
                    "type": "object",
                    "required": [
                      "email",
                      "language",
                      "background_checks"
                    ],
                    "properties": {
                      "email": {
                        "type": "string",
                        "format": "email",
                        "description": "Customer's email address."
                      },
                      "language": {
                        "type": "string",
                        "description": "Language code (e.g. \"EN\", \"FR\").",
                        "example": "EN"
                      },
                      "country": {
                        "type": "string",
                        "description": "ISO 3166-1 alpha-2 country code for the request context (e.g. \"NG\").",
                        "example": "NG"
                      },
                      "background_checks": {
                        "type": "object",
                        "required": [
                          "name"
                        ],
                        "description": "AML screening configuration.",
                        "properties": {
                          "name": {
                            "type": "object",
                            "required": [
                              "full_name"
                            ],
                            "description": "Subject name details.",
                            "properties": {
                              "full_name": {
                                "type": "string",
                                "description": "Subject's full name.",
                                "example": "John Doe"
                              }
                            }
                          },
                          "filters": {
                            "type": "array",
                            "description": "Screening categories to run.",
                            "items": {
                              "type": "string",
                              "enum": [
                                "sanction",
                                "warning",
                                "fitness-probity",
                                "pep",
                                "pep-class-1",
                                "pep-class-2",
                                "pep-class-3",
                                "pep-class-4"
                              ]
                            },
                            "example": [
                              "sanction",
                              "warning",
                              "fitness-probity",
                              "pep",
                              "pep-class-1",
                              "pep-class-2",
                              "pep-class-3",
                              "pep-class-4"
                            ]
                          },
                          "match_score": {
                            "type": "integer",
                            "minimum": 0,
                            "maximum": 100,
                            "default": 100,
                            "description": "Matching threshold from 0 to 100. A score of 100 applies the strictest accuracy.",
                            "example": 100
                          },
                          "dob": {
                            "type": "string",
                            "format": "date",
                            "description": "Subject's date of birth in YYYY-MM-DD format.",
                            "example": "1990-01-15"
                          },
                          "countries": {
                            "type": "array",
                            "description": "ISO alpha-2 country codes to restrict the screening to.",
                            "items": {
                              "type": "string"
                            },
                            "example": [
                              "NG"
                            ]
                          },
                          "rca_search": {
                            "type": "boolean",
                            "description": "Include relative and close associate (RCA) search.",
                            "default": true
                          },
                          "alias_search": {
                            "type": "boolean",
                            "description": "Include alias search.",
                            "default": true
                          }
                        }
                      }
                    }
                  }
                }
              },
              "examples": {
                "default": {
                  "summary": "Sample request",
                  "value": {
                    "verification_type": "aml_screening",
                    "input_data": {
                      "email": "customer@example.com",
                      "language": "EN",
                      "country": "NG",
                      "background_checks": {
                        "name": {
                          "full_name": "John Doe"
                        },
                        "filters": [
                          "sanction",
                          "warning",
                          "fitness-probity",
                          "pep",
                          "pep-class-1",
                          "pep-class-2",
                          "pep-class-3",
                          "pep-class-4"
                        ],
                        "match_score": 100,
                        "dob": "1990-01-15",
                        "countries": [
                          "NG"
                        ],
                        "rca_search": true,
                        "alias_search": true
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "400": {
            "description": "Bad Request - Missing or invalid parameters"
          },
          "401": {
            "description": "Unauthorized - Invalid or missing API key"
          },
          "403": {
            "description": "Forbidden - Insufficient credits or inactive key"
          },
          "404": {
            "description": "Not Found - Identity record not found"
          },
          "500": {
            "description": "Internal Server Error"
          },
          "201": {
            "description": "Verification created successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/V2SuccessResponse"
                },
                "examples": {
                  "success": {
                    "summary": "Successful verification",
                    "value": {
                      "success": true,
                      "message": "Verification request created successfully.",
                      "data": {
                        "id": "ver_9gjzgc36t",
                        "verification_type": "aml_screening",
                        "status": "verified",
                        "created_at": "2026-02-09T08:01:42.891Z",
                        "response_data": {
                          "first_name": "John",
                          "last_name": "Doe",
                          "date_of_birth": "1990-01-15",
                          "gender": "Male"
                        }
                      }
                    }
