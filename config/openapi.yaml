    "/api/v2/public/verifications/requests/document_verification/": {
      "post": {
        "summary": "Document Verification",
        "description": "Verify government-issued identity documents such as passports, national IDs, and driver's licenses across 47+ African countries.\n\nPublic API creates always use direct (offsite) mode. Submit the document image in `input_data.document.proof`.",
        "operationId": "public-document_verification",
        "tags": [
          "single-identity-verification"
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "input_data"
                ],
                "properties": {
                  "input_data": {
                    "type": "object",
                    "required": [
                      "email",
                      "language",
                      "document"
                    ],
                    "properties": {
                      "email": {
                        "type": "string",
                        "format": "email",
                        "description": "Customer's email address."
                      },
                      "language": {
                        "type": "string",
                        "description": "Language code (e.g. \"EN\", \"FR\").",
                        "example": "EN"
                      },
                      "country": {
                        "type": "string",
                        "description": "ISO 3166-1 alpha-2 country code (e.g. \"NG\", \"ZA\", \"GH\", \"KE\").",
                        "example": "NG"
                      },
                      "first_name": {
                        "type": "string",
                        "description": "Customer's first name for cross-validation."
                      },
                      "last_name": {
                        "type": "string",
                        "description": "Customer's last name for cross-validation."
                      },
                      "document": {
                        "type": "object",
                        "required": [
                          "proof"
                        ],
                        "description": "Document proof and matching options.",
                        "properties": {
                          "proof": {
                            "type": "string",
                            "description": "HTTPS URL to the front of the identity document (`jpeg`/`jpg`/`png`/`pdf`). Base64 data URIs are not accepted on the public API.",
                            "example": "https://cdn.example.com/documents/id-front.jpg"
                          },
                          "backside_proof": {
                            "type": "string",
                            "description": "HTTPS URL to the back of the document, same formats as `proof`. Base64 is not accepted.",
                            "example": "https://cdn.example.com/documents/id-back.jpg"
                          },
                          "backside_proof_required": {
                            "type": "boolean",
                            "description": "true to require a back image, false to skip it. Defaults to false.",
                            "default": false
                          },
                          "verification_mode": {
                            "type": "string",
                            "description": "Capture mode hint. Common value: \"any\".",
                            "example": "any"
                          },
                          "fetch_enhanced_data": {
                            "type": "boolean",
                            "description": "true to return enhanced OCR/extracted fields, false to skip. Defaults to true.",
                            "default": true
                          },
                          "name": {
                            "type": "object",
                            "description": "Optional name matching details for the document owner.",
                            "properties": {
                              "first_name": {
                                "type": "string",
                                "description": "Expected first name on the document."
                              },
                              "last_name": {
                                "type": "string",
                                "description": "Expected last name on the document."
                              },
                              "fuzzy_match": {
                                "type": "boolean",
                                "description": "true to allow fuzzy name matching, false for exact match. Defaults to true.",
                                "default": true
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              },
              "examples": {
                "default": {
                  "summary": "Sample request",
                  "value": {
                    "input_data": {
                      "email": "customer@example.com",
                      "language": "EN",
                      "country": "NG",
                      "first_name": "John",
                      "last_name": "Doe",
                      "document": {
                        "proof": "https://cdn.example.com/documents/id-front.jpg",
                        "backside_proof_required": false,
                        "verification_mode": "any",
                        "fetch_enhanced_data": true,
                        "name": {
                          "first_name": "John",
                          "last_name": "Doe",
                          "fuzzy_match": true
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
